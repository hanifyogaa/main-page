# Static hosting of the public tutorial site on the main domain.
# Install:   sudo cp nginx-fri-dev.cloud.conf /etc/nginx/sites-available/fri-dev.cloud
#            sudo ln -s /etc/nginx/sites-available/fri-dev.cloud /etc/nginx/sites-enabled/fri-dev.cloud
#            sudo nginx -t && sudo systemctl reload nginx
# Then issue the certificate once (certbot rewrites the 443 block and the HTTP redirect for you):
#            sudo certbot --nginx -d fri-dev.cloud -d www.fri-dev.cloud
# Web root: /var/www/fri-dev.cloud   (see README.md for how to upload into it)
# This file only touches the apex + www names; merci.fri-dev.cloud and any other server block stay as they are.

server {
    listen 80;
    listen [::]:80;
    server_name fri-dev.cloud www.fri-dev.cloud;

    root /var/www/fri-dev.cloud;
    index index.html;

    charset utf-8;

    # Pages are plain files: /mahasiswa/ -> mahasiswa/index.html; a missing page falls through to the branded 404.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets are replaced rarely; a day of caching keeps edits visible quickly. mp4 range requests (seeking) work by default.
    location ~* \.(?:css|js|webp|png|svg|ico|mp4|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
    }

    # Nothing here is a secret, but there is no reason to serve the generator or the docs.
    location ~ ^/(tools|deploy)/ { return 404; }
    location = /README.md { return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
